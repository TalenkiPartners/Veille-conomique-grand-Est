name: Veille quotidienne

on:
  schedule:
    # 06h30 heure de Paris = 05h30 UTC (04h30 UTC en heure d'été,
    # GitHub tolère un décalage de quelques minutes sur les cron)
    - cron: "30 5 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Générer la veille du jour
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python veille.py --mode daily --output docs/index.html

      - name: Publier la page mise à jour
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Mise à jour veille quotidienne"
          git push
